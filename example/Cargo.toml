[package]
edition = "2021"
name = "example"
publish = false
version = "0.1.0"

[dependencies]
axum = "0.8.9"
base64ct = { version = "1.8.3", features = ["alloc", "std"] }
hyper = { version = "1.11.0", features = ["full"] }
hyper-tls = "0.6.0"
hyper-util = { version = "0.1.20", features = ["client"] }
once_cell = "1.21.4"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tower-livereload = "0.10.3"
web-push-native = { path = "../web_push" }
